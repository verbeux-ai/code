name: Dependency audit

# Known advisories in the dependency tree (most of it is bundled into
# dist/cli.mjs, so users only get fixes through a new release). Starts as a
# report; flip continue-on-error off once the tree is clean.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  bun-audit:
    name: bun-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Audit dependencies (high and critical)
        continue-on-error: true
        run: bun audit --audit-level=high
